<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.0.13/css/all.css"
      integrity="sha384-DNOHZ68U8hZfKXOrtjWvjxusGo9WQnrNx2sqG0tfsghAvtVlRW3tvkXWZh58N9jp"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
      integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/toc.css" />
    <title>Blog navigation</title>
  </head>
  <body>
    <section id="toc" style="font-size: 0.9rem">
      <div style="margin-top: 0; margin-bottom: 1rem;">
        <div id="toc-category"></div>
      </div>
      <div style="margin-top: 0; margin-bottom: 0;">
        <div id="toc-year"></div>
      </div>
    </section>

    <script>
      (async function () {
        const response = await fetch('./data/posts.json');
        const posts = await response.json();

        const categoryBuilder = {
          getGroup: (post) => post.category,
          name: 'category',
          showCategory: false,
        };

        const yearBuilder = {
          getGroup: (post) => new Date(post.date).getUTCFullYear().toString(),
          name: 'year',
          showCategory: true,
        };

        const activeCategory = getUrlParameter('category');
        const activePostPath = getUrlParameter('post');
        const activePost = posts.find((post) => post.path === activePostPath) || null;

        renderTable('toc-category', categoryBuilder, posts, activeCategory, activePost);
        renderTable('toc-year', yearBuilder, posts, null, activePost);

        function resizeFrame() {
          const height = document.body.scrollHeight;
          const frame = window.frameElement;
          if (frame) {
            frame.style.height = Math.max(height + 8, 400) + 'px';
          }
        }

        const observer = new MutationObserver(() => resizeFrame());
        observer.observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
        resizeFrame();
      })();

      function renderTable(id, builder, posts, activeCategory, activePost) {
        const container = document.getElementById(id);
        if (!container) return;

        const groups = [...new Set(posts.map((post) => builder.getGroup(post)))].sort();

        for (const group of groups) {
          const card = document.createElement('div');
          card.classList.add('card');

          const groupPosts = posts.filter((post) => builder.getGroup(post) === group);
          const isOpen = shouldShowGroup(builder, group, groupPosts, activeCategory, activePost);

          const bodyId = `${builder.name}-${group.toLowerCase().replace(/\s+/g, '-')}`;

          const header = document.createElement('div');
          header.classList.add('card-header', 'bg-dark', 'text-white', 'p-2', 'collapse-toggle');
          header.setAttribute('role', 'button');
          header.setAttribute('tabindex', '0');
          header.setAttribute('aria-expanded', String(isOpen));
          header.setAttribute('data-target', `#${bodyId}`);
          header.innerHTML = `
            <h6 class="m-0">
              <div class="d-flex justify-content-between align-items-center">
                ${group}
                <span class="badge badge-danger badge-pill">${groupPosts.length}</span>
              </div>
            </h6>
          `;

          const body = document.createElement('div');
          body.id = bodyId;
          body.classList.add('collapse');
          if (isOpen) body.classList.add('show');

          header.addEventListener('click', () => {
            const willOpen = !body.classList.contains('show');
            body.classList.toggle('show', willOpen);
            header.setAttribute('aria-expanded', String(willOpen));
          });

          header.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              header.click();
            }
          });

          const list = document.createElement('div');
          list.classList.add('list-group');

          for (const post of groupPosts) {
            const item = document.createElement('a');
            item.href = '/blog/' + post.path + '/';
            item.title = post.excerpt;
            item.target = '_top';
            item.rel = 'noopener';
            item.classList.add('list-group-item', 'list-group-item-action', 'p-2');
            if (activePost !== null && post.path === activePost.path) {
              item.classList.add('active');
            }

            const codeBadge = post.codeUrl !== undefined ? '<i class="fab fa-github"></i>' : '';
            const downloadBadge = post.downloadUrl !== undefined ? '<i class="fas fa-download"></i>' : '';
            const categoryBadge = builder.showCategory
              ? `<span class="badge badge-secondary badge-pill">${post.category}</span>`
              : '';
            const mostRecentBadge = posts[posts.length - 1].path === post.path
              ? '<span class="badge badge-warning badge-pill">Most Recent</span>'
              : '';

            item.innerHTML = `${post.title}
              <p class="d-flex flex-wrap mb-0">
                <span><small class="${activePost !== null && post.path === activePost.path ? '' : 'text-muted'}">${post.date}</small></span>
                <span class="ml-auto">${codeBadge}${downloadBadge}${mostRecentBadge}${categoryBadge}</span>
              </p>`;

            list.appendChild(item);
          }

          body.appendChild(list);
          card.appendChild(header);
          card.appendChild(body);
          container.appendChild(card);
        }
      }

      function shouldShowGroup(builder, group, groupPosts, activeCategory, activePost) {
        if (activePost !== null) return groupPosts.some((post) => post.path === activePost.path);

        if (builder.name === 'category' && activeCategory !== null && activeCategory !== '') {
          return group === activeCategory;
        }

        return groupPosts.length > 0 && group === groupPosts[0].category;
      }

      function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        const results = regex.exec(window.location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
      }
    </script>
  </body>
</html>
